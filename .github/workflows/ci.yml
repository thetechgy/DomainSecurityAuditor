name: CI

on:
  pull_request:
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - "Tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - "Tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  PSSA_VERSION: "1.24.0"
  PESTER_VERSION: "5.7.1"

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.github.com:443
            *.githubusercontent.com:443
            www.powershellgallery.com:443

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Cache PowerShell modules
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}-${{ hashFiles('PSScriptAnalyzerSettings.psd1') }}
          restore-keys: |
            pssa-${{ runner.os }}-

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $moduleName = 'PSScriptAnalyzer'
          $requiredVersion = [Version]'${{ env.PSSA_VERSION }}'

          $installed = Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion }
          if (-not $installed) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name $moduleName -RequiredVersion $requiredVersion.ToString() -Scope CurrentUser -Force -AllowClobber
          }

          Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion } |
              Select-Object -First 1 |
              Format-List Name, Version, ModuleBase

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path $settingsPath)) {
              Write-Error "Settings file not found at $settingsPath"
              exit 1
          }

          $paths = @(
              'DomainSecurityAuditor.psm1'
              'DomainSecurityAuditor.psd1'
              'Public'
              'Private'
              'Examples'
              'Tests'
          ) | Where-Object { Test-Path $_ }

          if (-not $paths) {
              Write-Error 'No PowerShell paths found to analyze'
              exit 1
          }

          $ErrorActionPreference = 'Stop'
          $results = @()
          foreach ($p in $paths) {
              $results += Invoke-ScriptAnalyzer -Path $p -Recurse -Settings $settingsPath
          }

          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
              Write-Host "`nTotal issues: $($results.Count)"
              exit 1
          }
          Write-Host 'No issues found.'

      - name: Run PSScriptAnalyzer for SARIF
        if: always() && github.event_name == 'push'
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f # v1.1
        with:
          path: .
          settings: ./PSScriptAnalyzerSettings.psd1
          output: results.sarif
          recurse: true

      - name: Upload SARIF to Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@c37a8b7cd97e31de3fcbd9d84c401870edeb8d34 # v3
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer

  test:
    name: Pester (${{ matrix.os }}, PS ${{ matrix.pwsh-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pwsh-version: ['7.4', '7.5']

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.github.com:443
            *.githubusercontent.com:443
            www.powershellgallery.com:443
            aka.ms:443
            packages.microsoft.com:443
            psg-prod-eastus.azureedge.net:443
            www.nuget.org:443
            api.nuget.org:443

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup PowerShell ${{ matrix.pwsh-version }}
        uses: bjompen/UpdatePWSHAction@5d51fdbb9cc78d7e0534adf063e5612bc439cdaa # v1.0.2
        with:
          ReleaseVersion: ${{ matrix.pwsh-version }}

      - name: Cache Pester module
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.local/share/powershell/Modules/Pester
            ~/Documents/PowerShell/Modules/Pester
          key: pester-${{ matrix.os }}-${{ matrix.pwsh-version }}-${{ env.PESTER_VERSION }}
          restore-keys: |
            pester-${{ matrix.os }}-${{ matrix.pwsh-version }}-

      - name: Install Pester
        shell: pwsh
        run: |
          $moduleName = 'Pester'
          $requiredVersion = [Version]$env:PESTER_VERSION

          $installed = Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion }
          if (-not $installed) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name $moduleName -RequiredVersion $requiredVersion.ToString() -Scope CurrentUser -Force -AllowClobber
          }

          Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion } |
              Select-Object -First 1 |
              Format-List Name, Version, ModuleBase

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsPath = Join-Path -Path $PWD -ChildPath 'Output/TestResults'
          if (-not (Test-Path -Path $resultsPath)) {
              New-Item -ItemType Directory -Path $resultsPath -Force | Out-Null
          }

          if (-not (Test-Path -Path 'Tests')) {
              Write-Host 'No Pester tests found (Tests folder missing). Skipping.'
              exit 0
          }

          $testFiles = Get-ChildItem -Path 'Tests' -Filter '*.ps1' -File -Recurse -ErrorAction SilentlyContinue
          if (-not $testFiles) {
              Write-Host 'No Pester test files found under Tests. Skipping.'
              exit 0
          }

          $requiredVersion = [Version]$env:PESTER_VERSION
          Import-Module -Name Pester -RequiredVersion $requiredVersion.ToString() -Force

          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = Join-Path -Path $resultsPath -ChildPath 'PesterResults.xml'
          $coverageTargets = @(
              'DomainSecurityAuditor.psm1'
              'Public'
              'Private'
              'Examples'
          ) | Where-Object { Test-Path -Path $_ }
          if ($coverageTargets) {
              $config.CodeCoverage.Enabled = $true
              $config.CodeCoverage.OutputFormat = 'JaCoCo'
              $config.CodeCoverage.OutputPath = Join-Path -Path $resultsPath -ChildPath 'PesterCoverage.xml'
              $config.CodeCoverage.Path = $coverageTargets
              $config.CodeCoverage.CoveragePercentTarget = 70
          }
          else {
              $config.CodeCoverage.Enabled = $false
              Write-Host 'No coverage targets found; skipping code coverage.'
          }

          $result = Invoke-Pester -Configuration $config
          $result | Format-List -Property *

          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed tests."
          }

          if ($config.CodeCoverage.Enabled -and $result.CodeCoverage.CoveragePercent -lt 70) {
              throw "Code coverage ($($result.CodeCoverage.CoveragePercent)%) is below 70% threshold."
          }

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@43cde22af577b469ce7aabe9acddd813dcd380bb # v2
        with:
          name: Pester Tests (${{ matrix.os }} PS ${{ matrix.pwsh-version }})
          path: Output/TestResults/PesterResults.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pester-results-${{ matrix.os }}-ps${{ matrix.pwsh-version }}
          path: Output/TestResults/*.xml
          retention-days: 14
          if-no-files-found: warn

  coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Download all coverage artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: pester-results-*
          path: coverage-reports
          merge-multiple: true

      - name: List downloaded artifacts
        run: find coverage-reports -type f -name "*.xml" | head -20

      - name: Coverage summary comment
        if: hashFiles('coverage-reports/**/PesterCoverage.xml') != ''
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage-reports/**/PesterCoverage.xml
          format: markdown
          output: both
          badge: true
          thresholds: '60 70'
