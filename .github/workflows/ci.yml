name: CI

on:
  pull_request:
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - "Tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
      - "PSScriptAnalyzerSettings.psd1"
      - "Tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  PSSA_VERSION: "1.24.0"
  PESTER_VERSION: "5.7.1"

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.github.com:443
            *.githubusercontent.com:443
            www.powershellgallery.com:443
            psg-prod-eastus.azureedge.net:443
            cdn.powershellgallery.com:443
            onegetcdn.azureedge.net:443
            dc.services.visualstudio.com:443
            az416426.vo.msecnd.net:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache PowerShell modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/powershell/Modules/PSScriptAnalyzer
          key: pssa-${{ runner.os }}-${{ env.PSSA_VERSION }}-${{ hashFiles('PSScriptAnalyzerSettings.psd1') }}
          restore-keys: |
            pssa-${{ runner.os }}-

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $moduleName = 'PSScriptAnalyzer'
          $requiredVersion = [Version]'${{ env.PSSA_VERSION }}'

          $installed = Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion }
          if (-not $installed) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name $moduleName -RequiredVersion $requiredVersion.ToString() -Scope CurrentUser -Force -AllowClobber
          }

          Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion } |
              Select-Object -First 1 |
              Format-List Name, Version, ModuleBase

      - name: Install ConvertToSARIF
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ConvertToSARIF -Scope CurrentUser -Force -AllowClobber

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          if (-not (Test-Path $settingsPath)) {
              Write-Error "Settings file not found at $settingsPath"
              exit 1
          }

          $paths = @(
              'DomainSecurityAuditor.psm1'
              'DomainSecurityAuditor.psd1'
              'Public'
              'Private'
              'Examples'
              'Tests'
          ) | Where-Object { Test-Path $_ }

          if (-not $paths) {
              Write-Error 'No PowerShell paths found to analyze'
              exit 1
          }

          $ErrorActionPreference = 'Stop'
          $results = @()
          foreach ($p in $paths) {
              $results += Invoke-ScriptAnalyzer -Path $p -Recurse -Settings $settingsPath
          }

          # Generate SARIF for GitHub Security tab (push events only)
          if ('${{ github.event_name }}' -eq 'push') {
              if ($results) {
                  $results | ConvertTo-SARIF -FilePath 'results.sarif'
              } else {
                  # Create minimal valid SARIF when no issues found
                  @{
                      '$schema' = 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json'
                      version = '2.1.0'
                      runs = @(@{
                          tool = @{ driver = @{ name = 'PSScriptAnalyzer'; version = '${{ env.PSSA_VERSION }}' } }
                          results = @()
                      })
                  } | ConvertTo-Json -Depth 10 | Set-Content -Path 'results.sarif'
              }
          }

          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
              Write-Host "`nTotal issues: $($results.Count)"
              exit 1
          }
          Write-Host 'No issues found.'

      - name: Upload SARIF to Security tab
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer

  test:
    name: Pester (${{ matrix.os }}, PS ${{ matrix.pwsh-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pwsh-version: ['7.4', '7.5']

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            *.github.com:443
            *.githubusercontent.com:443
            www.powershellgallery.com:443
            aka.ms:443
            packages.microsoft.com:443
            psg-prod-eastus.azureedge.net:443
            www.nuget.org:443
            api.nuget.org:443

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PowerShell ${{ matrix.pwsh-version }}
        shell: pwsh
        run: ./.github/scripts/Install-PowerShellVersion.ps1 -Version '${{ matrix.pwsh-version }}'

      - name: Cache Pester module
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.local/share/powershell/Modules/Pester
            ~/Documents/PowerShell/Modules/Pester
          key: pester-${{ matrix.os }}-${{ matrix.pwsh-version }}-${{ env.PESTER_VERSION }}
          restore-keys: |
            pester-${{ matrix.os }}-${{ matrix.pwsh-version }}-

      - name: Install Pester
        shell: pwsh
        run: |
          $moduleName = 'Pester'
          $requiredVersion = [Version]$env:PESTER_VERSION

          $installed = Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion }
          if (-not $installed) {
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module -Name $moduleName -RequiredVersion $requiredVersion.ToString() -Scope CurrentUser -Force -AllowClobber
          }

          Get-Module -ListAvailable -Name $moduleName | Where-Object { $_.Version -eq $requiredVersion } |
              Select-Object -First 1 |
              Format-List Name, Version, ModuleBase

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resultsPath = Join-Path -Path $PWD -ChildPath 'Output/TestResults'
          if (-not (Test-Path -Path $resultsPath)) {
              New-Item -ItemType Directory -Path $resultsPath -Force | Out-Null
          }

          if (-not (Test-Path -Path 'Tests')) {
              Write-Host 'No Pester tests found (Tests folder missing). Skipping.'
              exit 0
          }

          $testFiles = Get-ChildItem -Path 'Tests' -Filter '*.ps1' -File -Recurse -ErrorAction SilentlyContinue
          if (-not $testFiles) {
              Write-Host 'No Pester test files found under Tests. Skipping.'
              exit 0
          }

          $requiredVersion = [Version]$env:PESTER_VERSION
          Import-Module -Name Pester -RequiredVersion $requiredVersion.ToString() -Force

          $config = [PesterConfiguration]::Default
          $config.Run.Path = 'Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = Join-Path -Path $resultsPath -ChildPath 'PesterResults.xml'
          $coverageTargets = @(
              'DomainSecurityAuditor.psm1'
              'Public'
              'Private'
              'Examples'
          ) | Where-Object { Test-Path -Path $_ }
          if ($coverageTargets) {
              $config.CodeCoverage.Enabled = $true
              $config.CodeCoverage.OutputFormat = 'JaCoCo'
              $config.CodeCoverage.OutputPath = Join-Path -Path $resultsPath -ChildPath 'PesterCoverage.xml'
              $config.CodeCoverage.Path = $coverageTargets
              $config.CodeCoverage.CoveragePercentTarget = 70
          }
          else {
              $config.CodeCoverage.Enabled = $false
              Write-Host 'No coverage targets found; skipping code coverage.'
          }

          $result = Invoke-Pester -Configuration $config
          $result | Format-List -Property *

          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed tests."
          }

          if ($config.CodeCoverage.Enabled -and $result.CodeCoverage.CoveragePercent -lt 70) {
              throw "Code coverage ($($result.CodeCoverage.CoveragePercent)%) is below 70% threshold."
          }

      - name: Publish test results
        if: always()
        shell: pwsh
        run: |
          $resultsFile = 'Output/TestResults/PesterResults.xml'
          if (Test-Path $resultsFile) {
            ./.github/scripts/Publish-TestResults.ps1 `
              -ResultsPath $resultsFile `
              -Title 'Pester Tests (${{ matrix.os }} PS ${{ matrix.pwsh-version }})'
          } else {
            Write-Host 'No test results file found'
          }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pester-results-${{ matrix.os }}-ps${{ matrix.pwsh-version }}
          path: Output/TestResults/*.xml
          retention-days: 14
          if-no-files-found: warn

  coverage:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts

      - name: Download all coverage artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pester-results-*
          path: coverage-reports
          merge-multiple: true

      - name: List downloaded artifacts
        run: find coverage-reports -type f -name "*.xml" | head -20

      - name: Coverage summary
        if: hashFiles('coverage-reports/**/PesterCoverage.xml') != ''
        shell: pwsh
        run: |
          ./.github/scripts/Publish-CoverageSummary.ps1 `
            -CoveragePath 'coverage-reports/**/PesterCoverage.xml' `
            -WarningThreshold 60 `
            -FailThreshold 70 `
            -Badge
